project:
  name: "J26-IT-449"
  title: "Explainable AI for Astronomical Discovery using XAI and Uncertainty Quantification"
  component: "AGN-Aware Radio Source Structure Classification using CNN + XAI"
  student: "J.A.B.G. Jayawickrama"
  student_id: "IT23308602"
  python_version: "3.12"

paths:
  data_root: "data"
  raw_data: "data/raw"
  mirabest_root: "data/raw/mirabest"
  interim_data: "data/interim"
  processed_data: "data/processed"
  splits: "data/splits"
  models: "outputs/models"
  metrics: "outputs/metrics"
  figures: "outputs/figures"
  confusion_matrix: "outputs/confusion_matrix"
  gradcam: "outputs/gradcam"
  xai_evaluation: "outputs/xai_evaluation"
  logs: "outputs/logs"

dataset:
  name: "MiraBest Zenodo v1 basic binary dataset"
  task: "binary FR-I vs FR-II classification"
  archive_filename: "batches.tar.gz"
  archive_md5: "fa9d6ad8fdde95b0a19df11433e8bca3"
  download_url: "http://www.jb.man.ac.uk/research/MiraBest/full_dataset/MiraBest_full_batches.tar.gz"
  label_mapping:
    0: "FR-I"
    1: "FR-II"
  include_uncertain: false
  include_hybrid: false

training:
  seed: 42
  batch_size: 32
  num_epochs: 20
  learning_rate: 0.001
  num_workers: 0
